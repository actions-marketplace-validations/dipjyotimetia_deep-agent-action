name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      # Smoke: run the action entrypoint from source (as the composite action does)
      # to prove every provider package loads. Fails CI here, not at runtime.
      - name: Smoke-run entrypoint
        run: DEEP_AGENT_SMOKE=1 bun run src/index.ts
