name: "Deep Agent Action"
description: "Issue/PR coding agent powered by the Deep Agents JS harness, running in-process on the runner."
author: "Dipjyoti Metia"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  trigger_phrase:
    description: "Phrase that triggers the agent in issue/PR/comment bodies."
    required: false
    default: "@agent"
  prompt:
    description: "Explicit instruction for workflow_dispatch runs (bypasses the trigger phrase)."
    required: false
  model:
    description: "Model id. Provider-prefixed (e.g. 'anthropic:claude-sonnet-4-6', 'openai:gpt-5') or a bare name."
    required: false
    default: "claude-sonnet-4-6"
  allowed_permissions:
    description: "Comma-separated repository permission levels allowed to trigger the agent."
    required: false
    default: "write,admin"
  allowed_commands:
    description: "Comma/newline-separated allow-list of shell command names the agent may run. Defaults to a common dev toolchain."
    required: false
  denied_commands:
    description: "Extra command names to block (merged with the built-in deny-list)."
    required: false
  fork_allow_label:
    description: "Label a write-access user can apply to authorize the agent on a fork PR. If unset, fork PRs are never run."
    required: false
  shell_timeout_seconds:
    description: "Max seconds for a single shell command."
    required: false
    default: "600"
  comment_debounce_ms:
    description: "Minimum interval between tracking-comment progress edits."
    required: false
    default: "8000"
  provider_api_key:
    description: "Model provider API key. May also be supplied via PROVIDER_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY env."
    required: false
  app_id:
    description: "GitHub App id used to mint a scoped, short-lived installation token. May also be supplied via APP_ID env."
    required: false
  app_private_key:
    description: "GitHub App private key (PEM). May also be supplied via APP_PRIVATE_KEY env."
    required: false
  github_token:
    description: "Token for GitHub API/git operations. Defaults to the workflow's GITHUB_TOKEN, so no setup is needed. NOTE: PRs opened with GITHUB_TOKEN do not trigger downstream CI — configure a GitHub App (app_id + app_private_key) only if you need the agent's PRs to run your CI."
    required: false
    default: ${{ github.token }}
  # --- Reserved for future phases (declared so the input surface is intentional) ---
  execution_mode:
    description: "Reserved. Only 'in_runner' is implemented in v1; 'bridge' (hosted Open SWE) is planned (P1)."
    required: false
    default: "in_runner"
  langgraph_url:
    description: "Reserved for bridge mode (P1)."
    required: false
  assistant_id:
    description: "Reserved for bridge mode (P1)."
    required: false
  require_push_approval:
    description: "Reserved for human-in-the-loop push approval (P1-1). Not yet implemented."
    required: false
    default: "false"

outputs:
  status:
    description: "Run outcome: success | skipped | refused | failed."
  pr_url:
    description: "URL of the opened pull request, if any."
  branch:
    description: "Branch the agent pushed to, if any."
  result_json:
    description: "Machine-readable run record (plan, tool calls, files changed, outcome)."

runs:
  using: "node24"
  main: "dist/index.js"
