# Example consumer workflow for Deep Agent Action.
# Copy into .github/workflows/ in the target repository.
#
# Usage:
#   - On an issue:        "@agent implement X"   → opens a PR with the change.
#   - On a pull request:  "@agent review"        → posts an inline code review.
#   - On a pull request:  "@agent fix Y"         → proposes a branch for review by default.
#
# Per-repo guidance (optional): commit `.github/deep-agent.yml` with
#   system_prompt. Keep runtime and security policy in this workflow.
name: Deep Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction for the agent"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# One agent run per issue/PR thread at a time: simultaneous mentions queue
# instead of racing the sticky tracking comment (and its memory block).
concurrency:
  group: deep-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dipjyotimetia/deep-agent-action@main
        with:
          trigger_phrase: "@agent"
          prompt: ${{ github.event.inputs.prompt }}
          # Any supported provider: anthropic | openai | azure | google | openrouter |
          # openai-compatible (+ base_url) | bedrock | vertexai.
          model: "claude-sonnet-4-6"
          allowed_commands: "git,npm,pnpm,bun,pytest,go,make"
          require_push_approval: "true" # explicit secure default: draft PR / proposed branch
          protected_paths: ".github/workflows/**,.github/CODEOWNERS"
          # fork_allow_label: "agent-approved"   # opt-in fork support, maintainer-gated
          # max_cost_usd: "2.00"                 # stop the run at ~$2 spend; partial work lands as a draft (needs a known model price)
          # max_total_tokens: "500000"           # or cap by tokens; re-counted each model call as context grows, so set it generously
          # max_runtime_minutes: "15"            # or cap by wall-clock; stops gracefully and lands partial work (unlike job timeout-minutes)
          # base_url: "https://api.groq.com/openai/v1"        # for model: "openai-compatible:..."
          # mcp_config: '{"mcpServers":{"fetch":{"command":"uvx","args":["mcp-server-fetch"]}}}' # only use deliberately scoped servers
        env:
          # Required: your model provider key (this is the only secret you must add).
          # Bedrock uses AWS_* env; Vertex AI uses GOOGLE_APPLICATION_CREDENTIALS; Azure uses AZURE_OPENAI_* env.
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          # Optional: a GitHub App identity. Without it, the workflow's built-in
          # GITHUB_TOKEN is used automatically — but PRs it opens won't trigger
          # your other CI workflows. Add an App only if you need that.
          # APP_ID: ${{ secrets.AGENT_APP_ID }}
          # APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
