# Example consumer workflow for Deep Agent Action.
# Copy into .github/workflows/ in the target repository.
#
# The action identity comes from a GitHub App (recommended): PRs it opens will
# trigger your other CI workflows, which a default GITHUB_TOKEN would not.
name: Deep Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction for the agent"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: <org>/deep-agent-action@v1
        with:
          trigger_phrase: "@agent"
          prompt: ${{ github.event.inputs.prompt }}
          model: "claude-sonnet-4-6"
          allowed_commands: "git,npm,pnpm,bun,pytest,go,make"
          # fork_allow_label: "agent-approved"   # opt-in fork support, maintainer-gated
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
