# Extending the agent with MCP (Model Context Protocol) servers.
# Copy into .github/workflows/ in the target repository.
#
# mcp_config is a JSON string. Each server is either a local command
# ({ command, args, env }) or a remote URL ({ url }). The servers' tools are
# exposed to the agent alongside its built-in file/shell tools.
name: Deep Agent (MCP tools)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

# One agent run per issue/PR thread at a time: simultaneous mentions queue
# instead of racing the sticky tracking comment (and its memory block).
concurrency:
  group: deep-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dipjyotimetia/deep-agent-action@main
        with:
          model: "claude-sonnet-4-6"
          # A single local server (HTTP fetch). Use valid JSON on one line, or a
          # YAML block scalar as below for readability.
          mcp_config: |
            {
              "mcpServers": {
                "fetch": { "command": "uvx", "args": ["mcp-server-fetch"] }
              }
            }
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
