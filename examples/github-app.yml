# Run the agent under a GitHub App identity.
# Copy into .github/workflows/ in the target repository.
#
# Why: PRs opened with the default GITHUB_TOKEN do NOT trigger your other CI
# workflows. A GitHub App identity mints a scoped, short-lived token whose PRs
# DO trigger downstream CI. It also gives the agent a distinct, auditable author.
#
# Setup:
#   1. Create a GitHub App with Contents (RW), Pull requests (RW), Issues (RW).
#   2. Install it on the repo/org.
#   3. Store the App id and private key as secrets (AGENT_APP_ID, AGENT_APP_PRIVATE_KEY).
name: Deep Agent (GitHub App)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dipjyotimetia/deep-agent-action@main
        with:
          model: "claude-sonnet-4-6"
          app_id: ${{ secrets.AGENT_APP_ID }}
          app_private_key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
