# Using a non-default model provider.
# Copy into .github/workflows/ and keep ONE of the steps below.
#
# A bare model name infers the provider (claude… / gpt… / gemini…). Otherwise
# prefix it with the provider name, for example openai:, google:, openrouter:,
# openai-compatible:, bedrock:, or vertexai:. See docs/providers.md for full details.
name: Deep Agent (multi-provider)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

# One agent run per issue/PR thread at a time: simultaneous mentions queue
# instead of racing the sticky tracking comment (and its memory block).
concurrency:
  group: deep-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --- OpenAI ---
      - uses: dipjyotimetia/deep-agent-action@main
        with:
          model: "openai:gpt-5"
        env:
          PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # --- OpenRouter ---
      # - uses: dipjyotimetia/deep-agent-action@main
      #   with:
      #     model: "openrouter:anthropic/claude-3.5-sonnet"
      #   env:
      #     PROVIDER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # --- OpenAI-compatible endpoint (Groq, xAI, DeepSeek, Together, Ollama, vLLM…) ---
      # base_url is REQUIRED for this provider.
      # - uses: dipjyotimetia/deep-agent-action@main
      #   with:
      #     model: "openai-compatible:llama-3.1-70b-versatile"
      #     base_url: "https://api.groq.com/openai/v1"
      #   env:
      #     PROVIDER_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # --- AWS Bedrock (uses the AWS credential chain, not PROVIDER_API_KEY) ---
      # Prefer OIDC via aws-actions/configure-aws-credentials in an earlier step.
      # - uses: dipjyotimetia/deep-agent-action@main
      #   with:
      #     model: "bedrock:anthropic.claude-3-5-sonnet-20241022-v2:0"
      #   env:
      #     AWS_REGION: us-east-1
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # --- GCP Vertex AI (uses ADC, not PROVIDER_API_KEY) ---
      # Authenticate with google-github-actions/auth in an earlier step.
      # - uses: dipjyotimetia/deep-agent-action@main
      #   with:
      #     model: "vertexai:gemini-2.5-pro"
      #   env:
      #     GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      #     GOOGLE_CLOUD_LOCATION: us-central1
