# Human-in-the-loop approval gate.
# Copy into .github/workflows/ in the target repository.
#
# With require_push_approval: "true", the agent never lands changes directly:
#   - On an issue:        opens a DRAFT pull request for you to review and mark ready.
#   - On a pull request:  pushes a "deep-agent/proposed/..." branch and posts a
#                         compare link instead of pushing to the PR branch.
# A human reviews and merges/promotes the change to land it.
name: Deep Agent (approval required)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction for the agent"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# One agent run per issue/PR thread at a time: simultaneous mentions queue
# instead of racing the sticky tracking comment (and its memory block).
concurrency:
  group: deep-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dipjyotimetia/deep-agent-action@main
        with:
          model: "claude-sonnet-4-6"
          prompt: ${{ github.event.inputs.prompt }}
          require_push_approval: "true"
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
